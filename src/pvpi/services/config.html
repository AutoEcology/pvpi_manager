<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PV Pi — Manage Configuration</title>
<script>
try { const theme = localStorage.getItem("pvpi-theme"); if (theme) document.documentElement.dataset.theme = theme; } catch (e) {}
</script>
<link rel="stylesheet" href="/dashboard.css">
<style>
fieldset { margin: 16px 0; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
legend { padding: 0 6px; font-weight: 600; }
.config-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 290px), 1fr)); gap: 16px 24px; }
.setting { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.setting label { font-weight: 600; }
.setting input:not([type="checkbox"]) { width: 100%; }
.setting input[type="checkbox"] { width: 20px; height: 20px; margin: 4px 0; }
button, input { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; }
button { cursor: pointer; }
button.primary { background: var(--bat); border-color: var(--bat); color: #fff; }
button:disabled { opacity: 0.5; cursor: default; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
#path { overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <header>
    <img class="brand-logo autoecology" src="/autoecology.png" alt="AutoEcology">
    <h1><img class="brand-logo pvpi" src="/pvpi.png" alt="PV Pi"></h1>
    <div class="side">
      <span id="updated" class="muted"></span>
      <button class="theme-toggle" id="theme" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <nav><a href="/">Metrics</a><a href="/schedule">Schedule</a><a href="/config" aria-current="page">Config</a></nav>


  <h2 class="page-title">Manage Configuration</h2>
  <p class="intro">Click "Save" to update the config file, "Reload" to reset the config parameters to the current save and "Restart" to restart the PV Pi manager services to apply all changes.<br>
    Choose your power schedule on the <a href="/schedule">Schedule</a> tab.</p>
  <p id="path" class="muted"></p>
  <form id="config-form">
    <div class="actions">
      <button class="primary" id="save" type="submit" disabled>Save</button>
      <button id="reload" type="button">Reload</button>
      <button id="restart" type="button">Restart</button>
      <span id="status" class="muted" role="status" aria-live="polite">Loading…</span>
    </div>
    <div id="groups"></div>
  </form>
</main>
<script src="/common.js"></script>
<script>
"use strict";
const GROUPS = [
  ["Battery protection", { low_bat_volt: "Shutdown voltage (V)", low_bat_readings: "Consecutive low readings", wake_up_volt: "Wake voltage (V)" }],
  ["Startup and shutdown", { startup_delay: "Startup delay (seconds)", power_off_on_shutdown: "Cut power after shutdown", power_off_delay: "Power-off delay (seconds)" }],
  ["Logging", { log_pvpi_stats: "Log readings and power events", log_period: "Reading interval (minutes)", data_log_path: "Log folder", keep_for_days: "Keep logs (days)", heartbeat_mins: "Power heartbeat (minutes)" }],
  ["Watchdog", { enable_watchdog: "Enable watchdog", watchdog_period_mins: "Watchdog timeout (minutes)" }],
  ["Clocks", { time_pi2mcu: "Set PV Pi time from Raspberry Pi at startup", time_mcu2pi: "Set Raspberry Pi time from PV Pi at startup" }],
  ["Connection and dashboard", { uart_port: "UART port", schedules_dir: "Schedule folder", full_dashboard: "Show history charts" }],
];
let original, dirty = false, writable = false;
const inputs = new Map();
function status(text, bad = false) { $("status").textContent = text; $("status").className = bad ? "bad" : "muted"; }
function render(data) {
  original = data.values; dirty = false; writable = !!data.path;
  inputs.clear(); $("groups").replaceChildren();
  $("path").textContent = data.path ? "Config file: " + data.path : "No config file selected. Start the dashboard with --config to save settings.";
  GROUPS.forEach(([title, fields]) => {
    const group = document.createElement("fieldset"), legend = document.createElement("legend"), grid = document.createElement("div");
    legend.textContent = title; grid.className = "config-fields";
    Object.entries(fields).forEach(([key, title]) => {
      const schema = data.fields[key], value = original[key];
      const box = document.createElement("div"), label = document.createElement("label"), input = document.createElement("input"), help = document.createElement("div");
      box.className = "setting"; label.htmlFor = input.id = "config-" + key; label.textContent = title;
      const numeric = ["integer", "number"].includes(schema.type);
      input.type = schema.type === "boolean" ? "checkbox" : numeric ? "number" : "text";
      if (input.type === "checkbox") input.checked = value; else input.value = value ?? "";
      if (numeric) {
        input.required = true; input.step = schema.type === "integer" ? "1" : "any";
        if (schema.minimum !== undefined) input.min = schema.minimum;
        if (schema.exclusiveMinimum !== undefined && schema.type === "integer") input.min = schema.exclusiveMinimum + 1;
        if (schema.maximum !== undefined) input.max = schema.maximum;
      } else if (input.type === "text") input.required = key !== "schedules_dir";
      input.disabled = !writable;
      help.id = input.id + "-help"; input.setAttribute("aria-describedby", help.id);
      help.className = "muted"; help.textContent = schema.description;
      input.addEventListener("input", () => { dirty = true; $("save").disabled = !writable; status("Not saved"); });
      inputs.set(key, input); box.append(label, input, help); grid.append(box);
    });
    group.append(legend, grid); $("groups").append(group);
  });
  $("save").disabled = true;
}
async function load() {
  try { render(await getJSON("/api/config")); status("Loaded"); }
  catch (err) { status(err.message, true); }
}
$("reload").onclick = () => { if (!dirty || confirm("Discard the changes not saved?")) load(); };
$("config-form").onsubmit = async event => {
  event.preventDefault();
  const values = {};
  inputs.forEach((input, key) => { values[key] = input.type === "checkbox" ? input.checked : input.type === "number" ? Number(input.value) : key === "schedules_dir" && !input.value.trim() ? null : input.value; });
  if (values.time_pi2mcu && values.time_mcu2pi) { status("Choose just one startup clock direction.", true); return; }
  $("save").disabled = true; $("reload").disabled = true; $("restart").disabled = true;
  // Keep edits steady until the save response arrives.
  inputs.forEach(input => input.disabled = true);
  try {
    render(await getJSON("/api/config", { values, original }, "PUT"));
    status("Saved. Click Restart to apply all settings.");
  } catch (err) {
    status(err.message, true); $("save").disabled = !writable;
  } finally { $("reload").disabled = false; $("restart").disabled = false; inputs.forEach(input => input.disabled = !writable); }
};
$("restart").onclick = async () => {
  if (dirty) { status("Save or Reload your changes before restarting.", true); return; }
  $("save").disabled = true; $("reload").disabled = true; $("restart").disabled = true;
  inputs.forEach(input => input.disabled = true);
  status("Restarting PV Pi services…");
  try {
    render(await getJSON("/api/services/restart", {}));
    status("PV Pi services restarted. Saved settings are applied.");
  } catch (err) { status(err.message, true); }
  finally { $("reload").disabled = false; $("restart").disabled = false; inputs.forEach(input => input.disabled = !writable); }
};
window.addEventListener("beforeunload", event => { if (dirty) { event.preventDefault(); event.returnValue = ""; } });
load();
</script>
</body>
</html>
