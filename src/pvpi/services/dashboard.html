<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PV Pi Dashboard</title>
<script>
// The theme picked with the toggle, before the page draws (so it doesn't flash the other one)
try { const theme = localStorage.getItem("pvpi-theme"); if (theme) document.documentElement.dataset.theme = theme; } catch (e) {}
</script>
<link rel="stylesheet" href="/dashboard.css">
</head>
<body>
<main>
  <header>
    <img class="brand-logo autoecology" src="/autoecology.png" alt="AutoEcology">
    <h1><img class="brand-logo pvpi" src="/pvpi.png" alt="PV Pi"></h1>
    <div class="side">
      <span id="updated" class="muted">Loading…</span>
      <button class="theme-toggle" id="theme" type="button" aria-label="Switch to dark mode" title="Switch to dark mode">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>
  <nav><a href="/" aria-current="page">Readings</a><a href="/schedule">Schedule</a></nav>

  <div class="tiles">
    <div class="tile"><div class="label">Estimated charge</div><div class="value" id="soc">–</div></div>
    <div class="tile"><div class="label">Battery voltage</div><div class="value" id="bat_v">–</div></div>
    <div class="tile"><div class="label">Battery current</div><div class="value" id="bat_c">–</div></div>
    <div class="tile"><div class="label">Solar voltage</div><div class="value" id="pv_v">–</div></div>
    <div class="tile"><div class="label">Solar current</div><div class="value" id="pv_c">–</div></div>
    <div class="tile"><div class="label">Board temperature</div><div class="value" id="temp">–</div></div>
  </div>

  <section id="history" hidden>
    <h2>History</h2>
    <div class="range">
      <label>From <input type="date" id="start"></label>
      <label>to <input type="date" id="end"></label>
      <span id="history-note" class="muted"></span>
    </div>
    <h2>Solar input</h2>
    <div class="charts" id="solar"></div>
    <h2>Battery</h2>
    <div class="charts" id="battery"></div>
    <h2>Board temperature</h2>
    <div class="charts" id="thermal"></div>
    <h2>Power</h2>
    <div class="charts" id="power"></div>
  </section>
</main>

<script src="/common.js"></script>
<script>
"use strict";
const REFRESH_MS = 60000;
const AVERAGE_OF = 12;          // points in the moving average
const GAP_MS = 30 * 60 * 1000;  // a longer gap between readings (e.g. overnight) breaks the line

const CHARTS = [
  { box: "solar", title: "Voltage", unit: "V", color: "--pv", series: c => c.pv_v },
  { box: "solar", title: "Current", unit: "A", color: "--pv", series: c => c.pv_c },
  { box: "solar", title: "Power estimate", unit: "W", color: "--pv", series: c => c.pv_v.map((v, i) => v * c.pv_c[i]) },
  { box: "battery", title: "Voltage", unit: "V", color: "--bat", series: c => c.bat_v },
  { box: "battery", title: "Charge current", unit: "A", color: "--bat", series: c => c.bat_c },
  { box: "battery", title: "Charge power estimate", unit: "W", color: "--bat", series: c => c.bat_v.map((v, i) => v * c.bat_c[i]) },
  { box: "thermal", title: "Temperature", unit: "°C", color: "--temp", series: c => c.temp },
];


// ---- Live readings ----
let historyOn = false;

async function refreshLive() {
  try {
    const r = await getJSON("/api/live");
    $("soc").textContent = fmt(r.soc, 0) + " %";
    $("bat_v").textContent = fmt(r.bat_v, 2) + " V";
    $("bat_c").textContent = fmt(r.bat_c, 2) + " A";
    $("pv_v").textContent = fmt(r.pv_v, 2) + " V";
    $("pv_c").textContent = fmt(r.pv_c, 2) + " A";
    $("temp").textContent = fmt(r.temp, 0) + " °C";
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
    $("updated").className = "muted";
    if (r.full_dashboard && !historyOn) { historyOn = true; $("history").hidden = false; refreshHistory(); }
  } catch (err) {
    $("updated").textContent = err.message;
    $("updated").className = "bad";
    if (!historyOn) { historyOn = true; $("history").hidden = false; refreshHistory(); }
  }
}

// ---- History ----
async function refreshHistory() {
  const params = new URLSearchParams();
  if ($("start").value) params.set("start", $("start").value);
  if ($("end").value) params.set("end", $("end").value);
  let h;
  try {
    h = await getJSON("/api/history?" + params);
  } catch (err) {
    if (err.message.includes("full_dashboard")) { $("history").hidden = true; return; }
    $("history-note").textContent = err.message;
    return;
  }
  for (const id of ["start", "end"]) {
    $(id).min = h.first || "";
    $(id).max = h.last || "";
    if (!$(id).value && h[id]) $(id).value = h[id];
  }
  const count = h.columns.t.length;
  $("history-note").textContent = h.first
    ? `${count} readings · logs from ${h.first} to ${h.last}`
    : "No logs yet: the manager writes them when log_pvpi_stats is on.";
  drawCharts(h.columns, h.power);
}

function movingAverage(values, n) {
  // Centred, over full windows only (like the raw line, broken across gaps by drawLine).
  const out = new Array(values.length).fill(null);
  const half = Math.floor(n / 2);
  let sum = 0;
  for (let i = 0; i < values.length; i++) {
    sum += values[i];
    if (i >= n) sum -= values[i - n];
    if (i >= n - 1) out[i - n + 1 + half] = sum / n;
  }
  return out;
}

function niceTicks(lo, hi, count) {
  const step0 = (hi - lo) / count;
  const mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= step0) || step0;
  const ticks = [];
  for (let v = Math.ceil(lo / step) * step; v <= hi + step * 1e-9; v += step) ticks.push(+v.toFixed(10));
  return ticks;
}

const SVG = "http://www.w3.org/2000/svg";
function el(name, attrs, parent) {
  const node = document.createElementNS(SVG, name);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (parent) parent.appendChild(node);
  return node;
}

let lastColumns = null, lastPower = null;
const toTime = t => new Date(t.replace(" ", "T")).getTime();  // the Pi's local times, as this browser's
function drawCharts(columns, power) {
  lastColumns = columns; lastPower = power;
  for (const box of ["solar", "battery", "thermal", "power"]) $(box).replaceChildren();
  const times = columns.t.map(toTime);
  // All the cards first, so each is measured at its width in the finished layout.
  const cards = CHARTS.map(chart => card($(chart.box), `${chart.title} (${chart.unit})`));
  const powerCard = card($("power"), "Pi on");
  CHARTS.forEach((chart, i) => drawChart(chart, cards[i], times, chart.series(columns)));
  if (power) drawPower(power, powerCard, times);
}

function card(box, heading) {
  const div = document.createElement("div");
  div.className = "chart";
  const title = document.createElement("h3");
  const readout = document.createElement("span");
  readout.className = "readout";
  title.append(heading, readout);
  div.appendChild(title);
  box.appendChild(div);
  return { card: div, title, readout, svg: el("svg", {}, div) };
}

function timeLabels(svg, t0, t1, x, W, H) {
  const days = (t1 - t0) / 86400000, n = W < 420 ? 2 : 4;
  for (let i = 0; i <= n; i++) {
    const d = new Date(t0 + (t1 - t0) * i / n);
    const label = days > 6 ? d.toLocaleDateString([], { month: "short", day: "numeric" })
      : days > 1 ? d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric" })
      : d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    el("text", { x: x(d.getTime()), y: H - 4, "text-anchor": i === 0 ? "start" : i === n ? "end" : "middle" }, svg).textContent = label;
  }
}

// ---- Power: when the Pi was on and the PV PI manager running, with each boot and shutdown ----
const ENDED = { schedule: "shut down by the schedule", "low battery": "shut down on low battery", unexpected: "ended unexpectedly" };
function drawPower(power, { svg, title, readout }, times) {
  const W = Math.max(240, Math.round(svg.getBoundingClientRect().width) || 600), L = 8, R = 8;
  const BAR = 60, GAP = 8, TOP = 6, BOTTOM = TOP + 2 * BAR + GAP;  // the running bar, then the scheduled one
  const AXIS = BOTTOM + 16, H = AXIS + 28, KEY = H - 6;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.style.height = H + "px";
  const span = list => (list || []).map(([a, b, how]) => [toTime(a), toTime(b), how]);
  const on = span(power.on), running = span(power.running), expected = span(power.expected);
  const boots = power.boots.map(toTime), downs = power.shutdowns.map(([t, why]) => [toTime(t), why]);
  if (!on.length && !running.length && !expected.length) {
    el("text", { x: W / 2, y: H / 2, "text-anchor": "middle" }, svg).textContent = "Nothing in the power log for these days yet";
    return;
  }
  const hours = on.reduce((sum, [a, b]) => sum + (b - a), 0) / 3600000;
  title.firstChild.textContent = `Pi on · ${hours.toFixed(1)} h, ${boots.length} start${boots.length === 1 ? "" : "s"}`;
  // The same time axis as the readings' charts when there are readings
  const all = [...on, ...running].flatMap(([a, b]) => [a, b]);
  const t0 = times.length ? times[0] : Math.min(...all);
  let t1 = times.length ? times[times.length - 1] : Math.max(...all);
  if (t1 <= t0) t1 = t0 + 1;
  const x = t => L + (Math.min(Math.max(t, t0), t1) - t0) / (t1 - t0) * (W - L - R);
  for (const [spans, cls, top] of [[running, "alive", TOP], [expected, "expected", TOP + BAR + GAP]]) {
    el("rect", { x: L, y: top, width: W - L - R, height: BAR, class: "track" }, svg);
    for (const [a, b] of spans) {
      if (b < t0 || a > t1) continue;
      el("rect", { x: x(a), y: top, width: Math.max(1.5, x(b) - x(a)), height: BAR, class: cls }, svg);
    }
  }
  for (const t of boots) el("line", { x1: x(t), x2: x(t), y1: TOP - 4, y2: BOTTOM + 4, class: "boot-mark" }, svg);
  for (const [t] of downs) el("line", { x1: x(t), x2: x(t), y1: TOP - 4, y2: BOTTOM + 4, class: "down-mark" }, svg);
  timeLabels(svg, t0, t1, x, W, AXIS + 4);
  let lx = L;
  for (const [cls, label] of [["alive", "Running"], ["expected", "Scheduled on"], ["boot-mark", "Boot"], ["down-mark", "Shutdown"]]) {
    if (cls.endsWith("mark")) el("line", { x1: lx + 7, x2: lx + 7, y1: KEY - 11, y2: KEY + 2, class: cls }, svg);
    else el("rect", { x: lx, y: KEY - 9, width: 14, height: 10, class: cls }, svg);
    const text = el("text", { x: lx + 20, y: KEY }, svg);
    text.textContent = label;
    lx += 28 + text.getComputedTextLength();
  }

  // One cursor over both bars, kept within the time axis
  const clock = t => new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const cursor = el("line", { class: "cursor", y1: TOP, y2: BOTTOM, visibility: "hidden" }, svg);
  const inside = (spans, t) => spans.some(([a, b]) => a <= t && t <= b);
  const show = event => {
    const box = svg.getBoundingClientRect();
    const px = Math.min(Math.max((event.clientX - box.left) / box.width * W, L), W - R);
    const t = t0 + (px - L) / (W - L - R) * (t1 - t0);
    const near = 5 * (t1 - t0) / (W - L - R);  // within 5 px of a boot or shutdown line
    cursor.setAttribute("x1", px); cursor.setAttribute("x2", px); cursor.setAttribute("visibility", "visible");
    const parts = [clock(t)];
    const boot = boots.find(b => Math.abs(b - t) <= near);
    const down = downs.find(([d]) => Math.abs(d - t) <= near);
    if (boot !== undefined) parts.push("booted " + clock(boot));
    if (down) parts.push(`shut down ${clock(down[0])} (${down[1]})`);
    const period = on.find(([a, b]) => a <= t && t <= b);
    parts.push(!period ? "off" : (inside(running, t) ? "running" : "on, manager not running")
      + (period[2] === "running" ? "" : ` until ${clock(period[1])} (${ENDED[period[2]] || period[2]})`));
    parts.push(power.expected === null ? "schedule unreadable" : inside(expected, t) ? "scheduled on" : "scheduled off");
    readout.textContent = parts.join(" · ");
  };
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerleave", () => { cursor.setAttribute("visibility", "hidden"); readout.textContent = ""; });
}

function drawChart(chart, { readout, svg }, times, values) {
  const W = Math.max(240, Math.round(svg.getBoundingClientRect().width) || 600), H = 190, L = 44, R = 8, T = 8, B = 22;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  if (!values.length) {
    el("text", { x: W / 2, y: H / 2, "text-anchor": "middle" }, svg).textContent = "No readings in this range";
    return;
  }
  const color = getComputedStyle(document.documentElement).getPropertyValue(chart.color).trim();
  const t0 = times[0], t1 = times[times.length - 1] === t0 ? t0 + 1 : times[times.length - 1];
  let lo = Math.min(...values), hi = Math.max(...values);
  if (hi === lo) { lo -= 1; hi += 1; }
  const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);

  for (const v of niceTicks(lo, hi, 4)) {
    el("line", { class: "grid", x1: L, x2: W - R, y1: y(v), y2: y(v) }, svg);
    el("text", { x: L - 6, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = +v.toFixed(2);
  }
  timeLabels(svg, t0, t1, x, W, H);

  const drawLine = (series, cls) => {
    let d = "", prev = null;
    series.forEach((v, i) => {
      if (v == null) { prev = null; return; }
      const broken = prev === null || times[i] - times[prev] > GAP_MS;
      d += `${broken ? "M" : "L"}${x(times[i]).toFixed(1)},${y(v).toFixed(1)}`;
      prev = i;
    });
    el("path", { class: cls, d, stroke: color, "vector-effect": "non-scaling-stroke" }, svg);
  };
  drawLine(values, "raw");
  drawLine(movingAverage(values, AVERAGE_OF), "avg");

  // Hover (or touch) for the reading at that time
  const cursor = el("line", { class: "cursor", y1: T, y2: H - B, visibility: "hidden", "vector-effect": "non-scaling-stroke" }, svg);
  const show = event => {
    const box = svg.getBoundingClientRect();
    const t = t0 + ((event.clientX - box.left) / box.width * W - L) / (W - L - R) * (t1 - t0);
    let i = times.findIndex(time => time >= t);
    if (i < 0) i = times.length - 1;
    if (i > 0 && t - times[i - 1] < times[i] - t) i -= 1;
    cursor.setAttribute("x1", x(times[i])); cursor.setAttribute("x2", x(times[i]));
    cursor.setAttribute("visibility", "visible");
    const when = new Date(times[i]).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    readout.textContent = `${fmt(values[i], 2)} ${chart.unit} · ${when}`;
  };
  svg.addEventListener("pointermove", show);
  svg.addEventListener("pointerleave", () => { cursor.setAttribute("visibility", "hidden"); readout.textContent = ""; });
}

window.addEventListener("themechange", () => { if (lastColumns) drawCharts(lastColumns, lastPower); });  // the charts take their colours when drawn

let resizing;
window.addEventListener("resize", () => {
  clearTimeout(resizing);
  resizing = setTimeout(() => { if (lastColumns) drawCharts(lastColumns, lastPower); }, 200);
});
$("start").addEventListener("change", refreshHistory);
$("end").addEventListener("change", refreshHistory);
refreshLive();
setInterval(() => { refreshLive(); if (historyOn && !$("history").hidden) refreshHistory(); }, REFRESH_MS);
</script>
</body>
</html>
